<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Kalam:wght@400;700&family=Kaushan+Script&family=Lora:wght@500;700&display=swap" rel="stylesheet">
<style>
[data-theme=rose]{--bg:#fff7f8;--ink:#241a1d;--muted:#8a6b73;--card:#fff;--line:#f2b8c6;--accent:#d9577a;--accent2:#b8315a;--on:#fff;--r:16px;--bs:solid;--sh:0 4px 0 #f2b8c6,0 10px 20px rgba(217,87,122,.12);--fh:'Kaushan Script','Cairo',sans-serif;
 --bgi:linear-gradient(rgba(240,140,165,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(240,140,165,.22) 1px,transparent 1px);--bgs:28px 28px}
[data-theme=chalk]{--bg:#1f3b34;--ink:#f2f0e6;--muted:#b9c9c1;--card:rgba(255,255,255,.05);--line:#e9e6d8;--accent:#ffd36b;--accent2:#8fe0c0;--on:#1f3b34;--r:8px;--bs:dashed;--sh:none;--fh:'Kalam','Cairo',sans-serif;
 --bgi:radial-gradient(ellipse at 30% 0,rgba(255,255,255,.1),transparent 60%)}
[data-theme=graph]{--bg:#eaf2fb;--ink:#14213d;--muted:#51608a;--card:#fff;--line:#14213d;--accent:#e0245e;--accent2:#2b59c3;--on:#fff;--r:4px;--bs:solid;--sh:4px 4px 0 var(--ink);--fh:'Lora','Cairo',serif;
 --bgi:linear-gradient(rgba(43,89,195,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(43,89,195,.15) 1px,transparent 1px);--bgs:28px 28px}
[data-theme=neon]{--bg:#150f33;--ink:#ffffff;--muted:#d9d3fb;--card:rgba(255,255,255,.1);--line:rgba(190,165,255,.6);--accent:#b794ff;--accent2:#5eead4;--on:#150f33;--r:18px;--bs:solid;--sh:0 0 26px rgba(148,100,255,.22);--fh:'Cairo',sans-serif;
 --bgi:radial-gradient(circle at 15% 10%,rgba(139,92,246,.35),transparent 45%),radial-gradient(circle at 90% 80%,rgba(45,212,191,.2),transparent 40%)}
html{background:var(--bg)}
*{box-sizing:border-box;margin:0}
body{font-family:'Cairo',sans-serif;background-color:var(--bg);background-image:var(--bgi);background-size:var(--bgs,auto);background-attachment:fixed;color:var(--ink);min-height:100vh;line-height:1.6}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.25em}
.sym{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.sym span{position:absolute;font:700 3.2rem 'Cairo';opacity:.09;color:var(--accent);animation:fl var(--d,26s) ease-in-out infinite alternate;will-change:transform}
@keyframes fl{from{transform:translate(0,0) rotate(-10deg)}50%{transform:translate(26px,-34px) rotate(6deg)}to{transform:translate(-22px,30px) rotate(12deg)}}
.wrap{position:relative;z-index:1;max-width:880px;margin:auto;padding:16px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:10px;font:800 1.1rem var(--fh)}
.av{border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 0 0 2px var(--line),0 6px 14px rgba(0,0,0,.18)}
.brand .av{width:40px;height:40px}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;border:1px var(--bs) var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.seg button{background:none;border:0;color:var(--ink);padding:5px 11px;font:600 .85rem 'Cairo';cursor:pointer}
.seg button.on{background:var(--accent);color:var(--on)}
button:focus-visible,summary:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin:6px 0 18px}
.box{background:var(--card);border:1px var(--bs) var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;backdrop-filter:blur(6px)}
.prof{display:flex;align-items:center;gap:16px}
.prof .av{width:112px;height:112px;border-width:5px}
.prof h1{font:700 1.35rem var(--fh);line-height:1.4}
.prof p{color:var(--muted);font-size:.92rem;margin-top:2px}
.count{text-align:center;display:flex;flex-direction:column;justify-content:center}
.count .n{font:800 3.4rem 'Cairo';color:var(--accent2);line-height:1}
.count p{color:var(--muted);font-size:.9rem}
.years{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.years>span{color:var(--muted);font-size:.9rem}
.chip{background:var(--card);color:var(--ink);border:1px var(--bs) var(--line);border-radius:999px;padding:5px 14px;font:600 .9rem 'Cairo';cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--accent2);color:var(--on)}
.tree{display:grid;gap:12px}
details{border-radius:var(--r)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;user-select:none}
summary::-webkit-details-marker{display:none}
.chev{margin-inline-start:auto;transition:transform .2s}
[dir=ltr] details:not([open])>summary .chev{transform:rotate(-90deg)}
[dir=rtl] details:not([open])>summary .chev{transform:rotate(90deg)}
.l1{background:var(--card);border:1px var(--bs) var(--line);box-shadow:var(--sh);backdrop-filter:blur(6px)}
.l1>summary{padding:14px 16px;font:700 1.15rem var(--fh);color:var(--accent2)}
.l1>summary .cnt{font:600 .8rem 'Cairo';color:var(--muted)}
.kids{padding:0 16px 14px}
.l2{border-top:1px var(--bs) var(--line)}
.l2>summary{padding:10px 4px;font-weight:600}
.l2>summary small{color:var(--accent);font-weight:700}
.leaves{margin-inline-start:14px;padding-inline-start:12px;border-inline-start:2px var(--bs) var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0}
.row span{display:flex;gap:8px;align-items:center}
.go{background:none;border:1px solid var(--accent2);color:var(--accent2);border-radius:var(--r);padding:2px 14px;font:600 .85rem 'Cairo';cursor:pointer}
.go:hover{background:var(--accent2);color:var(--on)}
.lock{text-align:center;padding:34px 18px}
.lock svg.i{width:2.6rem;height:2.6rem;color:var(--accent)}
.lock p{color:var(--muted);margin:6px 0 14px}
.cta{background:var(--accent);color:var(--on);border:0;border-radius:var(--r);padding:9px 22px;font:700 1rem 'Cairo';cursor:pointer}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:22px 0 10px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--on);padding:8px 20px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .25s;z-index:5;pointer-events:none}
.toast.show{opacity:1}
.srch{display:flex;align-items:center;gap:8px;background:var(--card);border:1px var(--bs) var(--line);border-radius:var(--r);padding:6px 12px;margin-bottom:12px}
.srch input{flex:1;background:none;border:0;color:var(--ink);font:600 1rem 'Cairo';outline:0;min-width:0}
.srch:focus-within{outline:3px solid var(--accent2)}
.bar{height:10px;border-radius:99px;background:var(--card);border:1px var(--bs) var(--line);overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);transition:width .4s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin:4px 0 14px}
.meta span{display:flex;gap:6px;align-items:center}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;color:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.chk.on{background:var(--accent2);border-color:var(--accent2);color:var(--on)}
.chk svg.i{width:16px;height:16px}
.math{font:700 1.5rem 'Cairo';direction:ltr;text-align:center;padding:10px 0}
.ans{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.ans input{width:130px;padding:7px 10px;border-radius:var(--r);border:1px var(--bs) var(--line);background:var(--card);color:var(--ink);font:700 1rem 'Cairo';text-align:center}
.res{text-align:center;min-height:1.6em;margin-top:8px;font-weight:700;color:var(--accent2)}
.tm{font:800 3rem 'Cairo';text-align:center;color:var(--accent2);direction:ltr}
.row code{font:600 1rem 'Cairo';direction:ltr;color:var(--accent2)}
[data-theme=neon] body{font-weight:600}[data-theme=neon] .sym span{opacity:.05}
.out .hero,.out .srch,.out .years,.out .bar,.out .meta,.out main,.out footer,.out #outbtn{display:none}
#login{display:none;max-width:420px;margin:30px auto;text-align:center}
.out #login{display:block}
#login .av{width:120px;height:120px;margin-bottom:10px}
#login h2{font:700 1.3rem var(--fh);margin-bottom:12px}
#login input,.mb input{width:100%;margin:6px 0;padding:10px 12px;border-radius:var(--r);border:1px var(--bs) var(--line);background:var(--card);color:var(--ink);font:600 1.05rem 'Cairo';text-align:center}
.err{color:var(--accent);min-height:1.5em;font-weight:700;margin:6px 0}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:10;padding:16px}
.mo[hidden]{display:none}
.mb{width:min(420px,100%);background:var(--bg);text-align:center}
.mb h3{font:700 1.15rem var(--fh);margin-bottom:6px}
.adm{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.adm+.chev{margin-inline-start:8px}
.ib{background:none;border:1px solid var(--accent2);color:var(--accent2);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;cursor:pointer;padding:0}
.ib:hover{background:var(--accent2);color:var(--on)}
.ib svg.i{width:15px;height:15px}
.acts{display:flex;gap:6px;align-items:center}
.cd{color:var(--accent2);font-weight:800;white-space:nowrap}
.emp{color:var(--muted);padding:6px 0;font-size:.9rem}
.outb{display:inline-flex;gap:6px;align-items:center;background:var(--accent);color:var(--on);border:0;border-radius:var(--r);padding:6px 14px;font:700 .85rem 'Cairo';cursor:pointer}
.tw{overflow-x:auto}.ft{width:100%;border-collapse:collapse}.ft th,.ft td{border:1px var(--bs) var(--line);padding:8px 10px;text-align:start}.ft th{color:var(--accent2)}.fx{font-weight:700;direction:ltr;text-align:left!important}
#inbbtn{display:none;position:relative}.adm #inbbtn{display:inline-flex}
.bdg,.pill{background:#e11d48;color:#fff;border-radius:999px;min-width:20px;height:20px;padding:0 6px;font:700 .75rem 'Cairo';display:inline-grid;place-items:center}
.bdg{position:absolute;top:-8px;inset-inline-end:-8px}.bdg:empty{display:none}
#mtx{width:100%;padding:10px 12px;border-radius:var(--r);border:1px var(--bs) var(--line);background:var(--card);color:var(--ink);font:600 1rem 'Cairo';resize:vertical}
.mytext,.msgc p{white-space:pre-wrap;overflow-wrap:anywhere}
.msgc{padding:8px 0;border-top:1px var(--bs) var(--line)}.msgc p{margin:6px 0 0}
@media(min-width:900px){.wrap{max-width:none;padding:22px 3cm}.sym span{font-size:5.5rem}.prof .av{width:150px;height:150px}.prof h1{font-size:1.9rem}.prof p{font-size:1.05rem}.count .n{font-size:4.4rem}}
@media(min-width:1100px){html{font-size:112.5%}.tree{grid-template-columns:repeat(2,1fr);align-items:start}.tree>.lock{grid-column:1/-1}}
@media(max-width:640px){.hero{grid-template-columns:1fr}.prof .av{width:88px;height:88px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.sym span{animation:none}}

.yo{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:grid;place-items:center;padding:12px}
.yo[hidden]{display:none}
.yb{width:min(960px,100%);display:flex;flex-direction:column;gap:8px}
.yst{position:relative;aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;user-select:none;-webkit-user-select:none}
.yst iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.ysh{position:absolute;inset:0;z-index:2;cursor:pointer}
.ycv{position:absolute;inset:0;z-index:3;background:#000;display:none;place-items:center;color:#fff;font-size:4rem;cursor:pointer}
.ycv.on{display:grid}
.ywm{position:absolute;pointer-events:none;font:700 .5rem 'Cairo';direction:ltr;white-space:nowrap;transition:top 60s linear,left 60s linear}
@media print{.yo{display:none!important}}
.yst{touch-action:none}
.yo.rot{padding:0;display:block}
.yo.rot .yb{position:fixed;top:0;left:0;width:100vh;width:100dvh;height:100vw;height:100dvw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg);transform:translateX(100dvw) rotate(90deg);padding:6px;gap:6px}
.yo.rot .yst{aspect-ratio:auto;flex:1;min-height:0}
.yb:fullscreen{width:100vw;height:100vh;padding:6px;background:#000;justify-content:center}
.yb:-webkit-full-screen{width:100vw;height:100vh;padding:6px;background:#000;justify-content:center}
.yb:fullscreen .yst,.yb:-webkit-full-screen .yst{aspect-ratio:auto;flex:1;min-height:0}
.yo,.yo *{-webkit-touch-callout:none;-webkit-user-drag:none}
.yct{display:flex;gap:8px;align-items:center;color:#fff;direction:ltr}
.yct input[type=range]{flex:1;accent-color:var(--accent)}
.yct .go{color:#fff;border-color:#fff}
.yct small{min-width:84px;text-align:center}

#tm{position:fixed;inset:0;z-index:110;display:grid;place-items:center;background:var(--bg);padding:16px}
#tm[hidden]{display:none}
#boot{display:none;position:fixed;inset:0;z-index:100;place-items:center;background:var(--bg)}
html.boot #boot{display:grid}
html.boot #login{display:none!important}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--accent);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.dvb{width:min(900px,100%);height:94vh;height:94dvh;display:flex;flex-direction:column;gap:8px}
.dvs{position:relative;flex:1;min-height:0;background:#fff;border-radius:var(--r);overflow:hidden}
.dvs iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.dcc{position:absolute;top:0;right:0;width:64px;height:56px;z-index:5;background:#3c4043}
.dcv{position:absolute;inset:0;z-index:6;background:#000;color:#fff;display:none;place-items:center;text-align:center;cursor:pointer;padding:20px}
.dcv.on{display:grid}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, doc, getDoc as _getDoc, setDoc as _setDoc, deleteDoc as _deleteDoc, collection, getDocs as _getDocs, query, where, writeBatch as _writeBatch, runTransaction as _runTransaction, getCountFromServer as _getCount, Timestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC0viwpOZOLHkQmDVqT0Qdz0rcfPkP7KL8",
  authDomain: "zomorodamaths.firebaseapp.com",
  projectId: "zomorodamaths",
  storageBucket: "zomorodamaths.firebasestorage.app",
  messagingSenderId: "209973089556",
  appId: "1:209973089556:web:981250e56c8bf3d79a9e01"
};
const ADMIN_EMAIL = 'admin@zomoroda.app';
const LIVE_ON = false; // true = لا يُشاهد الكود نفسه على جهازين في وقت واحد | false = إيقاف القيد
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });


/* ---- usage counters (this device only, per Pacific-time day = Firebase quota day) ---- */
const pday = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
const loadU = () => { let u = {}; try { u = JSON.parse(localStorage.getItem('fb_usage') || '{}'); } catch (e) {} return u.day === pday() ? u : { day: pday(), r: 0, w: 0, d: 0 }; };
let U = loadU();
const saveU = () => { try { localStorage.setItem('fb_usage', JSON.stringify(U)); } catch (e) {} };
const getDoc = async (...a) => { const s = await _getDoc(...a); U.r++; return s; };
const getDocs = async (...a) => { const s = await _getDocs(...a); U.r += Math.max(1, s.size); return s; };
const getCountFromServer = async (...a) => { const s = await _getCount(...a); U.r += Math.max(1, Math.ceil(s.data().count / 1000)); return s; };
const setDoc = async (...a) => { await _setDoc(...a); U.w++; };
const deleteDoc = async (...a) => { await _deleteDoc(...a); U.d++; };
function writeBatch(x) {
  const b = _writeBatch(x); let w = 0, d = 0;
  return {
    set(...a) { w++; b.set(...a); return this; },
    update(...a) { w++; b.update(...a); return this; },
    delete(...a) { d++; b.delete(...a); return this; },
    async commit() { await b.commit(); U.w += w; U.d += d; },
  };
}
const runTransaction = (x, fn) => _runTransaction(x, async (t) => fn({
  get: async (r) => { U.r++; return t.get(r); },
  set: (r, v) => { U.w++; return t.set(r, v); },
}));

const YEARS = ['1AM', '2AM', '3AM', '4AM', '1AS', '2AS', '3AS'];
const SECTIONS = ['lessons', 'videos', 'summaries', 'exercises'];
const RE_CODE = /^[A-Z0-9-]{3,40}$/;
const RE_EXP = /^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$/;
const TABLES = {
  codes: ['code', 'email', 'year', 'expires_at', 'max_devices', 'disabled'],
  devices: ['code', 'device'],
  chapters: ['id', 'year', 'section', 'title'],
  items: ['id', 'chapter_id', 'title', 'url'],
  exams: ['id', 'year', 'title', 'at'],
  formulas: ['id', 'year', 'name', 'expr'],
  messages: ['code', 'body', 'created_at', 'seen'],
};
const E = (e) => ({ error: e });
const nowStr = () => new Date().toISOString().replace('T', ' ').slice(0, 19);
const uid = () => Date.now() * 1000 + Math.floor(Math.random() * 1000);
const toTs = (s) => (s ? Timestamp.fromDate(new Date(String(s).replace(' ', 'T') + 'Z')) : null);
const D = (...p) => doc(db, ...p);
const COL = (n) => collection(db, n);
const byId = (a, b) => a.id - b.id;
let ctx = null, lastYear = YEARS[0];
const R = { chapters: [], items: [], formulas: [] };

async function delRefs(refs) {
  for (let i = 0; i < refs.length; i += 400) {
    const b = writeBatch(db);
    refs.slice(i, i + 400).forEach((r) => b.delete(r));
    await b.commit();
  }
}
async function wipeCol(name) { const s = await getDocs(COL(name)); await delRefs(s.docs.map((d) => d.ref)); }
async function purgeCode(c) {
  await deleteDoc(D('messages', c));
  const s = await getDocs(query(COL('sessions'), where('code', '==', c)));
  await delRefs(s.docs.map((d) => d.ref));
  await deleteDoc(D('codes', c));
}

async function ensure(rawCode) {
  const code = String(rawCode || '').trim().toUpperCase();
  if (!code) throw E('invalid');
  if (ctx && ctx.code === code && auth.currentUser && auth.currentUser.uid === ctx.uid) return ctx;
  ctx = null;
  if (auth.currentUser && !auth.currentUser.isAnonymous) await signOut(auth);
  if (!auth.currentUser) await signInAnonymously(auth);
  let snap = null;
  if (RE_CODE.test(code)) snap = await getDoc(D('codes', code));
  if (snap && snap.exists()) {
    let d = snap.data();
    if (d.disabled) throw E('invalid');
    if (d.expires_at && d.expires_at < nowStr()) throw E('expired');
    let id = auth.currentUser.uid;
    let s = await getDoc(D('sessions', id));
    if (s.exists() && s.data().code !== code) {
      await signOut(auth); await signInAnonymously(auth);
      id = auth.currentUser.uid; s = null;
    }
    if (!(s && s.exists() && s.data().code === code)) {
      for (let t = 0; t < 2; t++) {
        if ((d.devs || 0) >= d.max_devices) throw E('devices');
        try {
          const b = writeBatch(db);
          b.set(D('sessions', id), { code });
          b.update(D('codes', code), { devs: (d.devs || 0) + 1 });
          await b.commit();
          break;
        } catch (e) {
          if (t === 1) throw e;
          d = (await getDoc(D('codes', code))).data();
        }
      }
    }
    ctx = { role: 'student', code, year: d.year, uid: id };
    return ctx;
  }
  try {
    const cr = await signInWithEmailAndPassword(auth, ADMIN_EMAIL, code);
    ctx = { role: 'admin', code, uid: cr.user.uid };
    return ctx;
  } catch (e) {
    if (e && e.code === 'auth/network-request-failed') throw E('net');
    throw E('invalid');
  }
}

async function mutContent(year, fn) {
  const ref = D('content', year);
  return runTransaction(db, async (t) => {
    const s = await t.get(ref);
    const x = s.exists() ? s.data() : {};
    const o = { year, chapters: x.chapters || [], formulas: x.formulas || [] };
    const r = fn(o);
    t.set(ref, o);
    return r;
  });
}
async function findYear(pred) {
  for (const y of [lastYear, ...YEARS.filter((v) => v !== lastYear)]) {
    const s = await getDoc(D('content', y));
    if (s.exists() && pred(s.data())) return y;
  }
  return null;
}
async function mutExams(fn) {
  const ref = D('exams', 'list');
  return runTransaction(db, async (t) => {
    const s = await t.get(ref);
    const items = s.exists() ? s.data().items || [] : [];
    const r = fn(items);
    t.set(ref, { items });
    return r;
  });
}
async function allContent() {
  const out = [];
  for (const y of YEARS) {
    const s = await getDoc(D('content', y));
    out.push({ year: y, chapters: s.exists() ? s.data().chapters || [] : [], formulas: s.exists() ? s.data().formulas || [] : [] });
  }
  return out;
}
const pick = (o, cols) => { const r = {}; cols.forEach((c) => (r[c] = o[c] === undefined ? null : o[c])); return r; };

async function handle(path, method, body, code) {
  const u = new URL(path, 'http://x');
  const p = u.pathname.replace(/\/+$/, '');
  const q = Object.fromEntries(u.searchParams);
  method = method || 'GET';
  body = body || {};
  let m;
  if (U.day !== pday()) U = loadU();
  const c = await ensure(code);

  if (p === '/api/login') return { role: c.role, year: c.year || null };

  if (p === '/api/content' && method === 'GET') {
    let year = c.role === 'admin' ? q.year : c.year;
    if (!YEARS.includes(year)) year = YEARS[0];
    if (c.role === 'admin') lastYear = year;
    const [cs, ex] = await Promise.all([getDoc(D('content', year)), getDoc(D('exams', 'list'))]);
    const x = cs.exists() ? cs.data() : {};
    const chapters = (x.chapters || []).slice().sort(byId).map((ch) => ({

  if (p === '/api/message') {
