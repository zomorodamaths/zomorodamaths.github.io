DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="rose">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zomorodah Math</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Kalam:wght@400;700&family=Kaushan+Script&family=Lora:wght@500;700&display=swap" rel="stylesheet">
<style>
[data-theme=rose]{--bg:#fff7f8;--ink:#241a1d;--muted:#8a6b73;--card:#fff;--line:#f2b8c6;--accent:#d9577a;--accent2:#b8315a;--on:#fff;--r:16px;--bs:solid;--sh:0 4px 0 #f2b8c6,0 10px 20px rgba(217,87,122,.12);--fh:'Kaushan Script','Cairo',sans-serif;
 --bgi:linear-gradient(rgba(240,140,165,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(240,140,165,.22) 1px,transparent 1px);--bgs:28px 28px}
[data-theme=chalk]{--bg:#1f3b34;--ink:#f2f0e6;--muted:#b9c9c1;--card:rgba(255,255,255,.05);--line:#e9e6d8;--accent:#ffd36b;--accent2:#8fe0c0;--on:#1f3b34;--r:8px;--bs:dashed;--sh:none;--fh:'Kalam','Cairo',sans-serif;
 --bgi:radial-gradient(ellipse at 30% 0,rgba(255,255,255,.1),transparent 60%)}
[data-theme=graph]{--bg:#eaf2fb;--ink:#14213d;--muted:#51608a;--card:#fff;--line:#14213d;--accent:#e0245e;--accent2:#2b59c3;--on:#fff;--r:4px;--bs:solid;--sh:4px 4px 0 var(--ink);--fh:'Lora','Cairo',serif;
 --bgi:linear-gradient(rgba(43,89,195,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(43,89,195,.15) 1px,transparent 1px);--bgs:28px 28px}
[data-theme=neon]{--bg:#150f33;--ink:#ffffff;--muted:#d9d3fb;--card:rgba(255,255,255,.1);--line:rgba(190,165,255,.6);--accent:#b794ff;--accent2:#5eead4;--on:#150f33;--r:18px;--bs:solid;--sh:0 0 26px rgba(148,100,255,.22);--fh:'Cairo',sans-serif;
 --bgi:radial-gradient(circle at 15% 10%,rgba(139,92,246,.35),transparent 45%),radial-gradient(circle at 90% 80%,rgba(45,212,191,.2),transparent 40%)}
html{background:var(--bg)}
*{box-sizing:border-box;margin:0}
body{font-family:'Cairo',sans-serif;background-color:var(--bg);background-image:var(--bgi);background-size:var(--bgs,auto);background-attachment:fixed;color:var(--ink);min-height:100vh;line-height:1.6}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.25em}
.sym{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.sym span{position:absolute;font:700 3.2rem 'Cairo';opacity:.09;color:var(--accent);animation:fl var(--d,26s) ease-in-out infinite alternate;will-change:transform}
@keyframes fl{from{transform:translate(0,0) rotate(-10deg)}50%{transform:translate(26px,-34px) rotate(6deg)}to{transform:translate(-22px,30px) rotate(12deg)}}
.wrap{position:relative;z-index:1;max-width:880px;margin:auto;padding:16px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:10px;font:800 1.1rem var(--fh)}
.av{border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 0 0 2px var(--line),0 6px 14px rgba(0,0,0,.18)}
.brand .av{width:40px;height:40px}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;border:1px var(--bs) var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.seg button{background:none;border:0;color:var(--ink);padding:5px 11px;font:600 .85rem 'Cairo';cursor:pointer}
.seg button.on{background:var(--accent);color:var(--on)}
button:focus-visible,summary:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin:6px 0 18px}
.box{background:var(--card);border:1px var(--bs) var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;backdrop-filter:blur(6px)}
.prof{display:flex;align-items:center;gap:16px}
.prof .av{width:112px;height:112px;border-width:5px}
.prof h1{font:700 1.35rem var(--fh);line-height:1.4}
.prof p{color:var(--muted);font-size:.92rem;margin-top:2px}
.count{text-align:center;display:flex;flex-direction:column;justify-content:center}
.count .n{font:800 3.4rem 'Cairo';color:var(--accent2);line-height:1}
.count p{color:var(--muted);font-size:.9rem}
.years{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.years>span{color:var(--muted);font-size:.9rem}
.chip{background:var(--card);color:var(--ink);border:1px var(--bs) var(--line);border-radius:999px;padding:5px 14px;font:600 .9rem 'Cairo';cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--accent2);color:var(--on)}
.tree{display:grid;gap:12px}
details{border-radius:var(--r)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;user-select:none}
summary::-webkit-details-marker{display:none}
.chev{margin-inline-start:auto;transition:transform .2s}
[dir=ltr] details:not([open])>summary .chev{transform:rotate(-90deg)}
[dir=rtl] details:not([open])>summary .chev{transform:rotate(90deg)}
.l1{background:var(--card);border:1px var(--bs) var(--line);box-shadow:var(--sh);backdrop-filter:blur(6px)}
.l1>summary{padding:14px 16px;font:700 1.15rem var(--fh);color:var(--accent2)}
.l1>summary .cnt{font:600 .8rem 'Cairo';color:var(--muted)}
.kids{padding:0 16px 14px}
.l2{border-top:1px var(--bs) var(--line)}
.l2>summary{padding:10px 4px;font-weight:600}
.l2>summary small{color:var(--accent);font-weight:700}
.leaves{margin-inline-start:14px;padding-inline-start:12px;border-inline-start:2px var(--bs) var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0}
.row span{display:flex;gap:8px;align-items:center}
.go{background:none;border:1px solid var(--accent2);color:var(--accent2);border-radius:var(--r);padding:2px 14px;font:600 .85rem 'Cairo';cursor:pointer}
.go:hover{background:var(--accent2);color:var(--on)}
.lock{text-align:center;padding:34px 18px}
.lock svg.i{width:2.6rem;height:2.6rem;color:var(--accent)}
.lock p{color:var(--muted);margin:6px 0 14px}
.cta{background:var(--accent);color:var(--on);border:0;border-radius:var(--r);padding:9px 22px;font:700 1rem 'Cairo';cursor:pointer}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:22px 0 10px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--on);padding:8px 20px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .25s;z-index:5;pointer-events:none}
.toast.show{opacity:1}
.srch{display:flex;align-items:center;gap:8px;background:var(--card);border:1px var(--bs) var(--line);border-radius:var(--r);padding:6px 12px;margin-bottom:12px}
.srch input{flex:1;background:none;border:0;color:var(--ink);font:600 1rem 'Cairo';outline:0;min-width:0}
.srch:focus-within{outline:3px solid var(--accent2)}
.bar{height:10px;border-radius:99px;background:var(--card);border:1px var(--bs) var(--line);overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);transition:width .4s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin:4px 0 14px}
.meta span{display:flex;gap:6px;align-items:center}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;color:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.chk.on{background:var(--accent2);border-color:var(--accent2);color:var(--on)}
.chk svg.i{width:16px;height:16px}
.math{font:700 1.5rem 'Cairo';direction:ltr;text-align:center;padding:10px 0}
.ans{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.ans input{width:130px;padding:7px 10px;border-radius:var(--r);border:1px var(--bs) var(--line);background:var(--card);color:var(--ink);font:700 1rem 'Cairo';text-align:center}
.res{text-align:center;min-height:1.6em;margin-top:8px;font-weight:700;color:var(--accent2)}
.tm{font:800 3rem 'Cairo';text-align:center;color:var(--accent2);direction:ltr}
.row code{font:600 1rem 'Cairo';direction:ltr;color:var(--accent2)}
[data-theme=neon] body{font-weight:600}[data-theme=neon] .sym span{opacity:.05}
.out .hero,.out .srch,.out .years,.out .bar,.out .meta,.out main,.out footer,.out #outsg{display:none}
#login{display:none;max-width:420px;margin:30px auto;text-align:center}
.out #login{display:block}
#login .av{width:120px;height:120px;margin-bottom:10px}
#login h2{font:700 1.3rem var(--fh);margin-bottom:12px}
#login input,.mb input{width:100%;margin:6px 0;padding:10px 12px;border-radius:var(--r);border:1px var(--bs) var(--line);background:var(--card);color:var(--ink);font:600 1.05rem 'Cairo';text-align:center}
.err{color:var(--accent);min-height:1.5em;font-weight:700;margin:6px 0}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:10;padding:16px}
.mo[hidden]{display:none}
.mb{width:min(420px,100%);background:var(--bg);text-align:center}
.mb h3{font:700 1.15rem var(--fh);margin-bottom:6px}
.adm{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.adm+.chev{margin-inline-start:8px}
.ib{background:none;border:1px solid var(--accent2);color:var(--accent2);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;cursor:pointer;padding:0}
.ib:hover{background:var(--accent2);color:var(--on)}
.ib svg.i{width:15px;height:15px}
.acts{display:flex;gap:6px;align-items:center}
.cd{color:var(--accent2);font-weight:800;white-space:nowrap}
.emp{color:var(--muted);padding:6px 0;font-size:.9rem}
@media(min-width:900px){.wrap{max-width:none;padding:22px 3cm}.sym span{font-size:5.5rem}.prof .av{width:150px;height:150px}.prof h1{font-size:1.9rem}.prof p{font-size:1.05rem}.count .n{font-size:4.4rem}}
@media(min-width:1100px){html{font-size:112.5%}.tree{grid-template-columns:repeat(2,1fr);align-items:start}.tree>.lock{grid-column:1/-1}}
@media(max-width:640px){.hero{grid-template-columns:1fr}.prof .av{width:88px;height:88px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.sym span{animation:none}}
               </style></head>

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return null}
try{var s=JSON.parse(ls('zm')||'{}');if(s.lang)S.lang=s.lang;if(s.theme)S.theme=s.theme}catch(e){}
if(['rose','chalk','graph','neon'].indexOf(S.theme)<0)S.theme='rose';
DEV=ls('zmdev');if(!DEV){DEV=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Math.random()).slice(2)+Date.now();ls('zmdev',DEV)}
var P={done:{},streak:0,last:''};
try{Object.assign(P,JSON.parse(ls('zmp')||'{}'))}catch(e){}
(function(){var d=new Date().toISOString().slice(0,10),y=new Date(Date.now()-864e5).toISOString().slice(0,10);
 if(P.last!==d){P.streak=P.last===y?P.streak+1:1;P.last=d;saveP()}})();
function save(){ls('zm',JSON.stringify({lang:S.lang,theme:S.theme}))}
function saveP(){ls('zmp',JSON.stringify(P))}
function $(i){return document.getElementById(i)}
function E(x){return String(x).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1600)}
var LI={ar:0,fr:1,en:2};
function od(id,f){return (f||OPEN[id])?' open':''}
function fmt(n){return ('0'+Math.floor(n/60)).slice(-2)+':'+('0'+n%60).slice(-2)}
function node(id,icon,title,body){return '<details class="l1" data-id="'+id+'"'+od(id)+'><summary>'+icon+title+IC.chev+'</summary><div class="kids">'+body+'</div></details>'}
function ib(a,extra,icon,label){return '<button class="ib" data-a="'+a+'" '+extra+' aria-label="'+E(label)+'">'+icon+'</button>'}
function api(path,method,body){
 return fetch(API+path,{method:method||'GET',headers:{'X-Code':CODE,'X-Device':DEV,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined})
 .then(function(r){return r.json().then(function(j){if(!r.ok)throw j;return j})},function(){throw{error:'net'}});
}
function errText(e){return T[S.lang]['e_'+(e&&e.error)]||T[S.lang].e_net}
function load(){return api('/api/content?year='+S.view).then(function(j){S.role=j.role;if(j.role==='student'){S.sub=S.view=j.year}DATA=j.chapters;EX=j.exams||[];ls('zmc',CODE);render()}).catch(function(e){if(e&&(e.error==='invalid'||e.error==='expired'||e.error==='devices')){logout();$('lerr').textContent=errText(e)}else{toast(errText(e));render()}})}
function login(code){CODE=code.trim().toUpperCase();if(!CODE)return;$('lerr').textContent='';return load()}
function logout(){CODE='';S.role=null;DATA=[];EX=[];ls('zmc',null);render()}
function cd(at){var ms=new Date(at)-Date.now(),u=T[S.lang].u;if(!(ms>0))return T[S.lang].past;var d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);return d+' '+u[0]+' '+h+' '+u[1]+' '+m+' '+u[2]}
function fd(at){try{return new Date(at).toLocaleString({ar:'ar-DZ',fr:'fr-FR',en:'en-GB'}[S.lang],{dateStyle:'medium',timeStyle:'short'})}catch(e){return at}}
function updEx(){document.querySelectorAll('[data-at]').forEach(function(e){e.textContent=cd(e.dataset.at)});
 var t=T[S.lang],nx=EX.filter(function(e){return new Date(e.at)>Date.now()}).sort(function(a,b){return new Date(a.at)-new Date(b.at)})[0];
 $('days').textContent=nx?Math.max(0,Math.ceil((new Date(nx.at)-Date.now())/864e5)):'–';
 $('extitle').textContent=nx?t.exam+': '+nx.title:t.noexam}
function items(){var a=[];DATA.forEach(function(c){c.items.forEach(function(i){a.push(i)})});return a}
function render(){
 var t=T[S.lang],h=document.documentElement,li=LI[S.lang],adm=S.role==='admin';
 h.lang=S.lang;h.dir=S.lang==='ar'?'rtl':'ltr';h.dataset.theme=S.theme;
 document.body.classList.toggle('out',!S.role);
 document.querySelectorAll('[data-i18n]').forEach(function(e){e.textContent=t[e.dataset.i18n]});
 $('q').placeholder=t.search;
 document.querySelectorAll('#langs button').forEach(function(b){b.classList.toggle('on',b.dataset.l===S.lang)});
 document.querySelectorAll('#themes button').forEach(function(b){b.classList.toggle('on',b.dataset.t===S.theme)});
 if(!S.role)return;
 $('years').innerHTML=adm?'<span>'+t.admin+'</span>'+YEARS.map(function(y){return '<button class="chip'+(y===S.view?' on':'')+'" data-y="'+y+'">'+y+'</button>'}).join(''):'';
 var all=items(),tot=all.length,dn=all.filter(function(i){return P.done['i'+i.id]}).length;
 $('pbar').style.width=(tot?Math.round(dn/tot*100):0)+'%';
 $('ptxt').textContent=dn+' / '+tot+' '+t.done;
 $('stk').innerHTML=IC.flame+P.streak+' '+t.streak;
 updEx();
 var q=$('q').value.trim().toLowerCase();
 var out=SEC.map(function(k){
  var chs=DATA.filter(function(c){return c.section===k&&(!q||(c.title+' '+c.items.map(function(i){return i.title}).join(' ')).toLowerCase().indexOf(q)>-1)});
  if(q&&!chs.length)return '';
  var all2=[];DATA.forEach(function(c){if(c.section===k)c.items.forEach(function(i){all2.push(i)})});
  var d=all2.filter(function(i){return P.done['i'+i.id]}).length;
  var body=chs.map(function(c,ci){
   var id='c'+c.id;
   var rows=c.items.map(function(i){
    return '<div class="row"><span><button class="chk'+(P.done['i'+i.id]?' on':'')+'" data-d="i'+i.id+'" aria-label="'+t.done+'">'+IC.check+'</button>'+IC[k]+E(i.title)+'</span><span class="acts"><button class="go" data-u="'+E(i.url)+'">'+t.open+'</button>'+(adm?ib('delit','data-i="'+i.id+'"',IC.trash,t.delit):'')+'</span></div>'}).join('');
   if(!rows)rows='<div class="emp">'+t.empty+'</div>';
   var ac=adm?'<span class="adm">'+ib('additem','data-c="'+c.id+'"',IC.plus,t.additem)+ib('delch','data-c="'+c.id+'"',IC.trash,t.delch)+'</span>':'';
   return '<details class="l2" data-id="'+id+'"'+od(id,q)+'><summary><small>'+(ci+1)+'</small>'+E(c.title)+ac+IC.chev+'</summary><div class="leaves">'+rows+'</div></details>'}).join('');
  if(!body)body='<div class="emp">'+t.empty+'</div>';
  var sa=adm?'<span class="adm">'+ib('addch','data-s="'+k+'"',IC.plus,t.addch)+'</span>':'';
  return '<details class="l1" data-id="'+k+'"'+od(k,q)+'><summary>'+IC[k]+t[k]+'<span class="cnt">'+d+' / '+all2.length+'</span>'+sa+IC.chev+'</summary><div class="kids">'+body+'</div></details>'}).join('');
 var m=$('main');
 if(q){m.innerHTML=out||'<div class="box lock"><p>'+t.none+'</p></div>';return}
 CUR=GEN[S.view](PR(SEED));
 var chal='<div class="math">'+t.find+'<br>'+CUR.q+'<br>'+CUR.ask+' = ?</div><div class="ans"><input id="ans" inputmode="numeric" placeholder="'+t.ans+'"><button class="cta" id="chk">'+t.check+'</button><button class="go" id="newq">'+t.newq+'</button></div><p class="res" id="res"></p>';
 var forms=FM[S.view].map(function(f){return '<div class="row"><span>'+f[li]+'</span><code>'+f[3]+'</code></div>'}).join('');
 var tmr='<div class="tm" id="tmd">'+fmt(TM.left)+'</div><div class="ans"><button class="cta" id="tmgo">'+(TM.run?t.pause:t.start)+'</button><button class="go" id="tmmode">'+t[TM.mode]+'</button><button class="go" id="tmreset">'+t.reset+'</button></div>';
 var exh=EX.length?EX.map(function(e){return '<div class="row"><span>'+IC.cal+E(e.title)+'<br><small>'+E(fd(e.at))+'</small></span><b class="cd" data-at="'+E(e.at)+'">'+cd(e.at)+'</b></div>'}).join(''):'<div class="emp">'+t.noexam+'</div>';
 m.innerHTML=out+node('exams',IC.cal,t.exams,exh)+node('chal',IC.zap,t.chal,chal)+node('forms',IC.sigma,t.forms,forms)+node('timer',IC.clock,t.timer,tmr);
}
function mdl(title,fields,cb){
 var t=T[S.lang];$('mt').textContent=title;
 $('mf').innerHTML=fields.map(function(f,i){return '<input data-f="'+i+'" placeholder="'+E(f)+'" autocomplete="off">'}).join('');
 $('me').textContent='';$('mok').textContent=t.okb;$('mc').textContent=t.cancel;MD=cb;$('modal').hidden=false;
 var f=$('mf').firstChild;if(f)f.focus();
}
document.addEventListener('toggle',function(e){var d=e.target;if(d.dataset&&d.dataset.id&&!$('q').value.trim())OPEN[d.dataset.id]=d.open},true);
$('q').addEventListener('input',render);
$('code').addEventListener('keydown',function(e){if(e.key==='Enter')login($('code').value)});
function tick(){if(TM.left>0){TM.left--}else{TM.run=false;clearInterval(TM.id);toast(T[S.lang].end);TM.mode=TM.mode==='focus'?'rest':'focus';TM.left=TM.mode==='focus'?1500:300;render();return}
 if($('tmd'))$('tmd').textContent=fmt(TM.left)}
document.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 var t=T[S.lang],a=b.dataset.a;
 if(a){e.preventDefault();
  if(a==='addch')mdl(t.addch,[t.chname],function(v){return api('/api/chapter','POST',{year:S.view,section:b.dataset.s,title:v[0]})});
  else if(a==='additem')mdl(t.additem,[t.iname,t.ilink],function(v){if(!/^https:\/\//i.test(v[1]))throw{error:'badurl'};return api('/api/item','POST',{chapter_id:+b.dataset.c,title:v[0],url:v[1]})});
  else if(a==='delch')mdl(t.delch,[],function(){return api('/api/chapter/'+b.dataset.c,'DELETE')});
  else if(a==='delit')mdl(t.delit,[],function(){return api('/api/item/'+b.dataset.i,'DELETE')});
  return}
 if(b.id==='mok'){var v=[].map.call($('mf').querySelectorAll('input'),function(x){return x.value.trim()});
  Promise.resolve().then(function(){return MD(v)}).then(function(){$('modal').hidden=true;return load()}).catch(function(er){$('me').textContent=errText(er)});return}
 if(b.id==='mc'){$('modal').hidden=true;return}
 if(b.id==='logbtn'){login($('code').value);return}
 if(b.id==='outbtn'){logout();return}
 if(b.dataset.u){if(/^https:\/\//i.test(b.dataset.u))window.open(b.dataset.u,'_blank','noopener');return}
 if(b.dataset.l){S.lang=b.dataset.l;save()}
 else if(b.dataset.t){S.theme=b.dataset.t;save()}
 else if(b.dataset.y){S.view=b.dataset.y;load();return}
 else if(b.dataset.d){P.done[b.dataset.d]=!P.done[b.dataset.d];saveP()}
 else if(b.id==='chk'){var n=parseFloat($('ans').value.replace(',','.')),ok=n===CUR.a;$('res').textContent=ok?t.right:t.wrong;return}
 else if(b.id==='newq'){SEED=Math.floor(Math.random()*1e9)}
 else if(b.id==='tmgo'){TM.run=!TM.run;clearInterval(TM.id);if(TM.run)TM.id=setInterval(tick,1000);b.textContent=TM.run?t.pause:t.start;return}
 else if(b.id==='tmmode'){TM.mode=TM.mode==='focus'?'rest':'focus';TM.left=TM.mode==='focus'?1500:300}
 else if(b.id==='tmreset'){TM.left=TM.mode==='focus'?1500:300}
 else return;
 render();
});
setInterval(updEx,60000);
render();
var saved=ls('zmc');if(saved)login(saved);
</script>
</body>
</html>
